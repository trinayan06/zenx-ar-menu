<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Food Viewer | ZEN_X</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#000000;--surface:#111111;--card:#111111;
  --gold:#CC0000;--gold-light:#FF0000;--gold-dark:#990000;
  --text:#FFFFFF;--text-secondary:#cccccc;--text-muted:#999999;
  --radius:16px;--radius-sm:10px;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}

/* Header */
.header{padding:16px;background:rgba(10,10,10,.8);backdrop-filter:blur(10px);border-bottom:1px solid rgba(212,168,83,.1);display:flex;align-items:center;position:fixed;top:0;width:100%;z-index:100}
.back-btn{display:flex;align-items:center;gap:8px;padding:10px 20px;border-radius:50px;border:1px solid rgba(212,168,83,.25);background:transparent;color:var(--gold);font-family:'Inter';font-size:13px;font-weight:500;cursor:pointer;transition:all .3s;text-decoration:none}
.back-btn:hover{background:rgba(212,168,83,.1);border-color:var(--gold)}

/* Main Layout */
.main{flex:1;display:flex;flex-direction:column;margin-top:65px;padding-bottom:100px}
@media(min-width:768px){
  .main{flex-direction:row;padding-bottom:0;height:calc(100vh - 65px)}
  .viewer-section{flex:1;height:100%}
  .info-section{width:400px;height:100%;border-left:1px solid rgba(212,168,83,.1);overflow-y:auto}
}

/* Viewer Section */
.viewer-section{position:relative;width:100%;height:50vh;min-height:420px;background:radial-gradient(circle at center, var(--surface) 0%, var(--bg) 100%)}
model-viewer{width:100%;height:100%;--poster-color:transparent}

/* AR Instructions */
.ar-instructions{position:absolute;top:20px;left:50%;transform:translateX(-50%);background:rgba(10,10,10,.85);backdrop-filter:blur(10px);border:1px solid rgba(212,168,83,.4);border-radius:50px;padding:12px 24px;display:flex;align-items:center;gap:16px;z-index:20;width:90%;max-width:420px;box-shadow:0 12px 32px rgba(0,0,0,.6)}
.phone-icon-anim{font-size:28px;animation:tilt 2.5s infinite ease-in-out;line-height:1}
@keyframes tilt{0%,100%{transform:rotate(0deg)}25%{transform:rotate(-15deg)}75%{transform:rotate(15deg)}}
.ar-instructions-text{color:var(--gold-light);font-size:11px;line-height:1.5;font-family:'Inter';font-weight:500;letter-spacing:0.3px}
.ar-instructions-text strong{color:#fff;font-size:12px;display:block;margin-bottom:2px}

/* Controls Overlay */
.controls-overlay{position:absolute;bottom:90px;right:20px;display:flex;flex-direction:column;gap:12px;z-index:10}
.reset-btn{width:44px;height:44px;border-radius:50%;background:rgba(10,10,10,.6);border:1px solid rgba(212,168,83,.3);color:var(--gold);display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(4px);transition:all .3s}
.reset-btn:hover{background:rgba(212,168,83,.1);transform:scale(1.05)}
.reset-btn svg{width:20px;height:20px}

/* AR Button inside model-viewer */
.ar-button{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,var(--gold-dark),var(--gold));color:#FFFFFF;border:none;padding:18px 36px;border-radius:50px;font-family:'Inter';font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 8px 32px rgba(212,168,83,.5), 0 0 20px rgba(212,168,83,.3);display:flex;align-items:center;gap:10px;white-space:nowrap;z-index:20;transition:all .3s cubic-bezier(.4,0,.2,1);animation:glowPulse 2s infinite}
.ar-button:hover{transform:translateX(-50%) scale(1.05);box-shadow:0 12px 48px rgba(212,168,83,.7), 0 0 30px rgba(212,168,83,.5)}
@keyframes glowPulse{0%{box-shadow:0 8px 32px rgba(212,168,83,.4), 0 0 10px rgba(212,168,83,.2)}50%{box-shadow:0 8px 32px rgba(212,168,83,.7), 0 0 30px rgba(212,168,83,.6)}100%{box-shadow:0 8px 32px rgba(212,168,83,.4), 0 0 10px rgba(212,168,83,.2)}}

/* Info Section */
.info-section{padding:24px;background:var(--card);display:flex;flex-direction:column;border-radius:24px 24px 0 0;margin-top:-20px;position:relative;z-index:30}
@media(min-width:768px){.info-section{border-radius:0;margin-top:0}}
.drag-handle{width:40px;height:4px;background:rgba(255,255,255,.1);border-radius:4px;margin:0 auto 20px;display:block}
@media(min-width:768px){.drag-handle{display:none}}

.dish-name{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;color:var(--text);margin-bottom:8px}
.dish-price{font-family:'Playfair Display',serif;font-size:24px;font-weight:600;color:var(--gold);margin-bottom:20px}
.dish-desc{font-size:15px;line-height:1.6;color:var(--text-secondary);margin-bottom:32px;flex:1}

/* Add to Order Button */
.add-to-order-container{margin-top:auto;position:sticky;bottom:0;background:var(--card);padding:20px 0 0}
.btn-add{width:100%;padding:16px;border-radius:var(--radius-sm);background:transparent;border:1px solid rgba(212,168,83,.5);color:var(--gold);font-family:'Inter';font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:all .3s}
.btn-add:hover{background:rgba(212,168,83,.1);transform:translateY(-2px)}
.btn-add.added{background:linear-gradient(135deg,#2d7d46,#34a853);color:#fff;border-color:transparent}

/* Instructions */
.instructions{display:flex;align-items:center;justify-content:center;gap:20px;padding:12px;background:rgba(212,168,83,.05);border-radius:12px;border:1px solid rgba(212,168,83,.15);margin-bottom:24px}
.instruction-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--gold-light)}
.instruction-item svg{width:16px;height:16px;opacity:0.8}

@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(212,168,83,.4)}70%{box-shadow:0 0 0 12px rgba(212,168,83,0)}100%{box-shadow:0 0 0 0 rgba(212,168,83,0)}}
.pulse{animation:pulse .5s ease-out}
</style>
</head>
<body>

<header class="header" style="justify-content: space-between;">
  <a href="menu.html" class="back-btn">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    Back to Menu
  </a>
  <img src="logo.png" alt="ZEN_X Logo" style="height: 50px;">
</header>

<main class="main">
  <div class="viewer-section">
    <div class="ar-instructions" style="background: linear-gradient(135deg, var(--gold-dark), var(--gold)); color: #0a0a0a; border: none; padding: 16px 24px; box-shadow: 0 8px 32px rgba(212,168,83,0.4);">
      <div class="ar-instructions-text" style="color: #0a0a0a; font-size: 14px; font-weight: 700; text-align: center; width: 100%;">
        👆 Tap View in AR → Point camera at table → Food appears!
      </div>
    </div>

    <!-- The 3D Model Viewer with AR enabled -->
    <model-viewer id="foodViewer" 
                  src="3d-models/biryani.glb" 
                  ar 
                  ar-modes="scene-viewer webxr quick-look" 
                  ar-placement="floor" 
                  shadow-intensity="1" 
                  camera-controls>
      
      <!-- Big Glowing AR Button triggers model-viewer's built-in AR functionality -->
      <button slot="ar-button" class="ar-button" id="arButton" onclick="document.querySelector('model-viewer').activateAR()">
        👆 View in AR
      </button>
    </model-viewer>

    <div class="controls-overlay">
      <button class="reset-btn" onclick="resetView()" title="Reset View">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
    </div>
  </div>

  <div class="info-section">
    <div class="drag-handle"></div>
    
    <div class="instructions">
      <div class="instruction-item">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"/></svg>
        Drag to Rotate
      </div>
      <div class="instruction-item">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"/></svg>
        Pinch to Zoom
      </div>
    </div>

    <h1 class="dish-name" id="dishName">Loading...</h1>
    <div class="dish-price" id="dishPrice">₹0</div>
    <p class="dish-desc" id="dishDesc">Please wait while the 3D model loads...</p>
    
    <div class="add-to-order-container">
      <button class="btn-add" id="addBtn" onclick="addToOrder()">
        + Add to Order
      </button>
    </div>
  </div>
</main>

<script>
// Dish data matching the main page
const dishes = [
  {id:1,name:"Butter Chicken",price:449,desc:"Tender chicken in rich, creamy tomato-butter gravy with aromatic spices. Perfectly paired with naan or rice.", glb: "3d-models/butter_chicken.glb"},
  {id:2,name:"Paneer Tikka",price:349,desc:"Chargrilled cottage cheese marinated in smoky tandoori spices, served with fresh mint chutney.", glb: "3d-models/biryani.glb"},
  {id:3,name:"Chicken Biryani",price:399,desc:"Fragrant basmati rice layered with succulent chicken and saffron, slow-cooked to perfection.", glb: "3d-models/biryani.glb"},
  {id:4,name:"Dal Makhani",price:299,desc:"Slow-cooked black lentils in a velvety butter and fresh cream sauce. A vegetarian delight.", glb: "3d-models/dal_makhni.glb"},
  {id:5,name:"Gulab Jamun",price:199,desc:"Golden, melt-in-your-mouth milk dumplings soaked in a delicate rose-scented cardamom syrup.", glb: "3d-models/gulab_jamun.glb"},
  {id:6,name:"Mango Lassi",price:149,desc:"Chilled creamy yogurt blended with sweet Alphonso mango and a hint of saffron.", glb: "3d-models/lacchi.glb"}
];

let currentDish = null;

// Get dish ID and optional model path from URL params
const params = new URLSearchParams(window.location.search);
const dishId = parseInt(params.get('id')) || 1;
const modelParam = params.get('model');

function loadDishData() {
  currentDish = dishes.find(d => d.id === dishId) || dishes[0];
  
  document.getElementById('dishName').textContent = currentDish.name;
  document.getElementById('dishPrice').textContent = '₹' + currentDish.price;
  document.getElementById('dishDesc').textContent = currentDish.desc;
  
  // Dynamically update the 3D model source
  // Priority: URL model param > dish glb > default
  const viewer = document.getElementById('foodViewer');
  if (modelParam) {
    viewer.src = decodeURIComponent(modelParam);
  } else if (currentDish.glb) {
    viewer.src = currentDish.glb;
  }
  
  checkCartStatus();
}

function resetView() {
  const viewer = document.getElementById('foodViewer');
  viewer.cameraOrbit = "auto auto auto";
  viewer.cameraTarget = "auto auto auto";
  viewer.fieldOfView = "auto";
}

function addToOrder() {
  if(!currentDish) return;
  
  // Update local cart object (we use localStorage to sync with index.html)
  let cartStr = localStorage.getItem('spicecraft_cart');
  let cart = cartStr ? JSON.parse(cartStr) : {};
  
  cart[currentDish.id] = (cart[currentDish.id] || 0) + 1;
  localStorage.setItem('spicecraft_cart', JSON.stringify(cart));
  
  // Visual feedback
  const btn = document.getElementById('addBtn');
  btn.classList.add('added', 'pulse');
  btn.textContent = `✓ Added (${cart[currentDish.id]})`;
  
  setTimeout(() => btn.classList.remove('pulse'), 500);
}

function checkCartStatus() {
  if(!currentDish) return;
  
  let cartStr = localStorage.getItem('spicecraft_cart');
  if(cartStr) {
    let cart = JSON.parse(cartStr);
    if(cart[currentDish.id] > 0) {
      const btn = document.getElementById('addBtn');
      btn.classList.add('added');
      btn.textContent = `✓ Added (${cart[currentDish.id]})`;
    }
  }
}

// Initialize
document.addEventListener('DOMContentLoaded', loadDishData);
</script>
</body>
</html>
